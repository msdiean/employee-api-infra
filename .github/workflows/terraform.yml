name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.12.2
  TF_WORKING_DIR: terraform/environments/dev
  AWS_ROLE_TO_ASSUME: arn:aws:iam::755395261332:role/github-actions-role

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: [self-hosted, terraform]

    permissions:
      id-token: write
      contents: read

    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Clean Previous Checkov Output
        run: |
          if [ -d "checkov-results.sarif" ]; then
            sudo rm -rf checkov-results.sarif || true
          fi
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsSession

      - name: Verify AWS Authentication
        run: aws sts get-caller-identity

      - name: Build Lambda Package
        run: |
          # Create a minimal Lambda deployment package with deterministic timestamps
          python3 << 'EOF'
          import zipfile
          import os
          
          os.makedirs('lambda_build', exist_ok=True)
          
          # Create index.js
          with open('lambda_build/index.js', 'w') as f:
              f.write('exports.handler = async (event) => { return { statusCode: 200, body: "OK" }; };')
          
          # Create zip file with fixed date_time for reproducibility
          # This ensures the same hash across multiple runs
          with zipfile.ZipFile('employee-api.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              zinfo = zipfile.ZipInfo('index.js', date_time=(2024, 1, 1, 0, 0, 0))
              with open('lambda_build/index.js', 'rb') as f:
                  zf.writestr(zinfo, f.read())
          
          import shutil
          shutil.rmtree('lambda_build')
          
          # Verify file
          size = os.path.getsize('employee-api.zip')
          import hashlib
          with open('employee-api.zip', 'rb') as f:
              sha256 = hashlib.sha256(f.read()).hexdigest()
          print(f'Created employee-api.zip ({size} bytes, SHA256: {sha256[:16]}...)')
          EOF

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Fix Checkov Output Permissions
        if: always()
        run: |
          if [ -d "checkov-results.sarif" ]; then
            sudo chmod -R 755 checkov-results.sarif || true
          fi

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan -no-color

      - name: Terraform Plan Summary
        run: terraform show -no-color tfplan | tail -80

      - name: Upload tfplan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan

      - name: Upload Lambda Package
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: ${{ env.TF_WORKING_DIR }}/employee-api.zip

  terraform-apply:
    name: Terraform Apply

    needs: terraform-plan

    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')

    runs-on: [self-hosted, terraform]

    permissions:
      id-token: write
      contents: read

    timeout-minutes: 60

    environment:
      name: production

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsSession

      - name: Verify AWS Authentication
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download tfplan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Download Lambda Package
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
